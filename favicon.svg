<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#121a2e" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff07c" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8" />

  <!-- Outer Energy Target Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="4" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Target Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="100" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="412" x2="256" y2="476" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="36" y1="256" x2="100" y2="256" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="412" y1="256" x2="476" y2="256" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Inner Glowing Ring -->
  <circle cx="256" cy="256" r="130" fill="rgba(18, 26, 46, 0.85)" stroke="url(#cyanGrad)" stroke-width="5" />

  <!-- PMT Monogram / Text -->
  <g filter="url(#glow)">
    <text x="256" y="278" font-family="'Outfit', 'Arial Black', sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4">
      PMT
    </text>
  </g>

  <!-- Gunny Arrow / Star Accent -->
  <polygon points="256,150 264,166 282,166 268,176 273,192 256,182 239,192 244,176 230,166 248,166" fill="url(#cyanGrad)" />
</svg>
